name: Iris for Android
# The signing key is NOT in this repo. CI signs only with the repository secrets IRIS_KS_B64 (base64 PKCS12) and IRIS_KS_PASS.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Signing key (from repository secrets only)
        env:
          KS_B64: ${{ secrets.IRIS_KS_B64 }}
          KS_PASS: ${{ secrets.IRIS_KS_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::IRIS_KS_B64 / IRIS_KS_PASS secrets are missing; refusing to build an unsigned or insecure APK."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/iris.p12"
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KS_FILE: ${{ runner.temp }}/iris.p12
          KS_PASS: ${{ secrets.IRIS_KS_PASS }}
          VERSION_CODE: ${{ github.run_number }}
      - run: rm -f "$RUNNER_TEMP/iris.p12"
        if: always()
      - run: cp android/app/build/outputs/apk/release/app-release.apk Iris.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: shell-${{ github.run_number }}
          name: Iris for Android ${{ github.run_number }}
          files: Iris.apk
          make_latest: 'true'
